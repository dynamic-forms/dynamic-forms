<ng-template #dialogTemplateRef>
  <div class="dynamic-form-wrapper" [class]="theme" [class.maximized]="maximized">
    <div class="dynamic-form" [class]="classNameForm" [class.maximized]="maximized">
      <div class="dynamic-form-modal" [class]="classNameModal" [class.maximized]="maximized">
        @if (title || titleHtml || headerActions?.length) {
          <div class="modal-header" [class]="classNameHeader">
            @if (titleHtml) {
              <div class="modal-title" [class]="classNameTitle" [innerHTML]="titleHtml"></div>
            } @else {
              <div class="modal-title" [class]="classNameTitle">{{ title }}</div>
            }
            @if (headerActions?.length) {
              <div class="modal-toolbar">
                <dynamic-form-elements [elements]="headerActions" />
              </div>
            }
          </div>
        }
        <mat-dialog-content class="modal-body" [class]="classNameChildren" [class.maximized]="maximized">
          <dynamic-form-elements [elements]="children" />
        </mat-dialog-content>
        @if (footerActions?.length) {
          <mat-dialog-actions class="modal-footer" [class]="classNameFooter">
            <dynamic-form-elements [elements]="footerActions" />
          </mat-dialog-actions>
        }
      </div>
    </div>
  </div>
</ng-template>
