<!-- eslint-disable @angular-eslint/template/no-inline-styles -->
@if (isOpen$ | async) {
  <div class="dynamic-form-modal modal" [class]="classNameForm" [class.maximized]="maximized">
    <div
      class="modal-dialog modal-dialog-centered modal-dialog-scrollable"
      [class]="classNameModal"
      [class.maximized]="maximized"
      [style.width]="maximized ? maxWidth || '100%' : width"
      [style.min-width]="maximized ? maxWidth || '100%' : minWidth"
      [style.max-width]="maximized ? maxWidth || '100%' : maxWidth"
      [style.min-height]="maximized ? '100%' : undefined"
      [style.max-height]="maximized ? '100%' : undefined"
      [style.margin]="maximized ? '0px auto' : undefined"
    >
      <div
        class="modal-content"
        [style.height]="maximized ? maxHeight || '100%' : height"
        [style.min-height]="maximized ? maxHeight || '100%' : minHeight"
        [style.max-height]="maxHeight || '100%'"
      >
        @if (title || titleHtml || headerActions?.length) {
          <div class="modal-header" [class]="classNameHeader">
            @if (titleHtml) {
              <div class="modal-title" [class]="classNameTitle" [innerHTML]="titleHtml"></div>
            } @else {
              <div class="modal-title" [class]="classNameTitle">{{ title }}</div>
            }
            @if (headerActions?.length) {
              <div class="modal-toolbar">
                <dynamic-form-elements [elements]="headerActions" />
              </div>
            }
          </div>
        }
        <div class="modal-body" [class]="classNameChildren">
          <dynamic-form-elements [elements]="children" />
        </div>
        @if (footerActions?.length) {
          <div class="modal-footer" [class]="classNameFooter">
            <dynamic-form-elements [elements]="footerActions" />
          </div>
        }
      </div>
    </div>
  </div>
}
